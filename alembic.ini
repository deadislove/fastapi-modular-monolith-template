[alembic]
script_location = alembic
prepend_sys_path = .
# newline (not the deprecated "os", which splits version_locations on
# os.pathsep — wrong for this multi-line list) — matches the format below.
path_separator = newline

# alembic/versions/ (flat, root) holds history from before this split: it
# predates the per-module convention and bundles users+products' original
# tables in one revision — not moved/split, since that would rewrite revision
# IDs already applied to real databases. Every module's *new* migrations go in
# its own subdirectory instead. See docs/database.md#migrations.
version_locations =
    %(here)s/alembic/versions
    %(here)s/alembic/versions/users
    %(here)s/alembic/versions/products
    %(here)s/alembic/versions/orders

# Override with DATABASE_URL env var at runtime
sqlalchemy.url = sqlite+aiosqlite:///./app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
