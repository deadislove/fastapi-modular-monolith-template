target-version = "py312"
line-length = 100

# Autogenerated by `alembic revision --autogenerate` each time — not hand-written
# app code, and re-fixing the same boilerplate style on every new migration is
# friction with no payoff.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["app"]
