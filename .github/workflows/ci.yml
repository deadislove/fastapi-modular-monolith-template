name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Architecture boundaries
        run: lint-imports

      - name: Tests
        run: pytest

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Proves the schema-per-module migration (CREATE SCHEMA + cross-schema FK)
      # applies cleanly on real PostgreSQL, not just SQLite.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://app:app_password@localhost:5432/app_db
        run: alembic upgrade head
